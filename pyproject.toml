[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcomposer"
# The version lives in bitcomposer/__init__.py alone; the tag workflow checks
# that a vX.Y.Z tag names it.
dynamic = ["version"]
description = "Procedural 16-bit chiptune music generator — creates Impulse Tracker (.it) files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# The player's window is Qt (QtQuick). Essentials is the part of PySide6 it
# uses, a third of the full download.
# jeepney speaks D-Bus for MPRIS (the media keys) on Linux; pure Python.
# Not PySide6 6.12 on Python 3.10 and 3.11: it gives back a reference to
# True that it never took each time a signal fires, and before 3.12 True
# can be freed, so the player crashed after some minutes of playing
# (Fatal Python error: bool_dealloc). 6.11 is clean, and from 3.12 on True
# is immortal. tests/test_player.py's signal test tells when a newer
# PySide6 may come back.
dependencies = ["PySide6-Essentials>=6.5,!=6.12.*; python_version < '3.12'",
                "PySide6-Essentials>=6.5; python_version >= '3.12'",
                "jeepney>=0.8; sys_platform == 'linux'"]
authors = [
    { name = "CatDogBark", email = "catdogbark@pm.me" },
]
keywords = ["chiptune", "tracker", "music", "procedural", "16-bit", "snes", "genesis", "impulse-tracker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]

[project.scripts]
bitcomposer = "bitcomposer.cli:main"
bitcomposer-player = "bitcomposer.player.window:main"

# SPC import runs on the emulator, a compiled package of its own with a wheel
# per platform (emu/, released by emu.yml). An extra rather than a
# dependency: where no wheel matches, pip would try to build it and fail
# for want of a Rust toolchain, and the generator and the player must
# install everywhere. bitcomposer/spc/emulate.py names the version it calls.
[project.optional-dependencies]
import = ["bitcomposer-emu>=0.3.1,<0.4"]

[project.urls]
Homepage = "https://github.com/CatDogBark/bitComposer"
Repository = "https://github.com/CatDogBark/bitComposer"
Issues = "https://github.com/CatDogBark/bitComposer/issues"
Changelog = "https://github.com/CatDogBark/bitComposer/blob/main/CHANGELOG.md"

# Only the library ships, with its subpackages (samples/, packs/). A fixed
# list of just "bitcomposer" left them out once they existed, so an installed
# copy could not import; and without a filter, setuptools' flat-layout
# discovery would also install tests/ as a top-level package.
[tool.setuptools.packages.find]
include = ["bitcomposer*"]

# The player's window, font and icon are files beside its code.
[tool.setuptools.package-data]
"bitcomposer.player" = ["qml/*.qml", "fonts/*.ttf", "fonts/LICENSE.txt", "icons/*.svg"]

[tool.setuptools.dynamic]
version = { attr = "bitcomposer.__version__" }
