[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcomposer"
# The version lives in bitcomposer/__init__.py alone; the tag workflow checks
# that a vX.Y.Z tag names it.
dynamic = ["version"]
description = "Procedural 16-bit chiptune music generator — creates Impulse Tracker (.it) files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# The player's window is Qt (QtQuick). Essentials is the part of PySide6 it
# uses, a third of the full download.
# jeepney speaks D-Bus for MPRIS (the media keys) on Linux; pure Python.
dependencies = ["PySide6-Essentials>=6.5", "jeepney>=0.8; sys_platform == 'linux'"]
authors = [
    { name = "CatDogBark", email = "catdogbark@pm.me" },
]
keywords = ["chiptune", "tracker", "music", "procedural", "16-bit", "snes", "genesis", "impulse-tracker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]

[project.scripts]
bitcomposer = "bitcomposer.cli:main"
bitcomposer-player = "bitcomposer.player.window:main"

[project.urls]
Homepage = "https://github.com/CatDogBark/bitComposer"
Repository = "https://github.com/CatDogBark/bitComposer"
Issues = "https://github.com/CatDogBark/bitComposer/issues"
Changelog = "https://github.com/CatDogBark/bitComposer/blob/main/CHANGELOG.md"

# Only the library ships, with its subpackages (samples/, packs/). A fixed
# list of just "bitcomposer" left them out once they existed, so an installed
# copy could not import; and without a filter, setuptools' flat-layout
# discovery would also install tests/ as a top-level package.
[tool.setuptools.packages.find]
include = ["bitcomposer*"]

# The player's window, font and icon are files beside its code.
[tool.setuptools.package-data]
"bitcomposer.player" = ["qml/*.qml", "fonts/*.ttf", "fonts/LICENSE.txt", "icons/*.svg"]

[tool.setuptools.dynamic]
version = { attr = "bitcomposer.__version__" }
