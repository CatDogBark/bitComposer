name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: libopenmpt for the player's tests
        run: sudo apt-get install -y -q libopenmpt0 > /dev/null || sudo apt-get install -y -q libopenmpt0t64 > /dev/null
      - name: Qt for the window's tests (offscreen), D-Bus for the MPRIS test
        run: |
          sudo apt-get install -y -q libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 dbus-daemon > /dev/null || sudo apt-get install -y -q libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 dbus > /dev/null
          python -m pip install --quiet PySide6-Essentials jeepney
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate and measure a batch
        run: |
          for s in 1 2 3 4 5 6; do python -m bitcomposer.cli -s $s -d out; done
          python tools/analyze.py 'out/*.it'
      - name: Package installs cleanly
        run: |
          python -m pip install --quiet .
          cd / && bitcomposer --version
          python -c "import bitcomposer, importlib.util; assert importlib.util.find_spec('tests') is None"
