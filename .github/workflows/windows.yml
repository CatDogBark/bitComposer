name: Windows build

# Builds the player (bitComposer.exe, a folder build: Qt starts in a moment
# from a folder, where a single file would unpack ~100 MB on every launch)
# and the command line (bitcomposer-cli.exe, one file, no Qt) on a Windows
# runner, renders the player offscreen at common screen sizes and scalings,
# zips the folder with a short readme, builds the installer, keeps all of it
# as workflow artifacts, and on a tag (or a manual run naming one) attaches
# the zip and the installer to that GitHub release. The build runs on every
# push to main and on pull requests as well, so a broken Windows build shows
# up when it breaks and not on release day (0.9.0 and 0.9.1 both found out
# at the tag).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the zip to (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip pyinstaller
          python -m pip install --quiet .
      - name: Smoke test
        run: |
          python -m bitcomposer.cli --version
          python -m bitcomposer.cli -s 11 --style snes --pack megamanx -d out
          dir out
      - name: Fetch libopenmpt for Windows
        shell: pwsh
        run: |
          # The player plays through libopenmpt. The official Windows dev
          # build (lib.openmpt.org) carries libopenmpt.dll with its
          # openmpt-*.dll companions for x64; the newest 0.x release zip is
          # taken from the listing so the version is not pinned here.
          $index = Invoke-WebRequest -UseBasicParsing https://lib.openmpt.org/files/libopenmpt/dev/
          $names = [regex]::Matches($index.Content, 'libopenmpt-[0-9.]+\+release\.dev\.windows\.vs\d+\.zip') | ForEach-Object { $_.Value } | Sort-Object -Unique
          if (-not $names) { throw "no libopenmpt Windows dev zip found in the listing" }
          $zip = $names | Sort-Object { [version]([regex]::Match($_, '\d+\.\d+\.\d+').Value) } | Select-Object -Last 1
          Write-Host "libopenmpt: $zip"
          Invoke-WebRequest -UseBasicParsing "https://lib.openmpt.org/files/libopenmpt/dev/$zip" -OutFile libopenmpt.zip
          Expand-Archive libopenmpt.zip -DestinationPath libopenmpt
          $dir = Get-ChildItem -Recurse -Directory libopenmpt | Where-Object { Test-Path (Join-Path $_.FullName 'libopenmpt.dll') } | Where-Object { $_.FullName -match 'amd64|x64|x86_64' } | Select-Object -First 1
          if (-not $dir) { throw "libopenmpt.dll for x64 not found in $zip" }
          New-Item -ItemType Directory -Force -Path dll | Out-Null
          Copy-Item (Join-Path $dir.FullName '*.dll') dll/
          Get-ChildItem dll
      - name: Build executables
        run: |
          # Windows paths are case-insensitive: "bitcomposer" and "bitComposer"
          # would be one file, so the command line gets a -cli suffix and
          # goes into the player's folder. bitComposer.exe is the player (it
          # generates as well); the libopenmpt DLLs sit in its bundle, where
          # player/openmpt.py looks, and --collect-data brings the window's
          # QML, font and icon. The command line leaves Qt out.
          # The version resources name the product, publisher and copyright
          # holder in Explorer's Properties > Details.
          python tools/windows/make_icon.py build/bitcomposer.ico
          python tools/windows/make_version_file.py build/version-cli.txt bitcomposer-cli.exe "bitComposer command line"
          python tools/windows/make_version_file.py build/version-player.txt bitComposer.exe "bitComposer"
          pyinstaller --noconfirm --onefile --name bitcomposer-cli --console --icon build/bitcomposer.ico --version-file build/version-cli.txt --collect-submodules bitcomposer --exclude-module PySide6 --exclude-module shiboken6 tools/windows/launch_cli.py
          pyinstaller --noconfirm --onedir --name bitComposer --windowed --icon build/bitcomposer.ico --version-file build/version-player.txt --collect-submodules bitcomposer --collect-data bitcomposer --add-binary "dll/*.dll;." tools/windows/launch_player.py
          Copy-Item dist/bitcomposer-cli.exe dist/bitComposer/
          dist\bitComposer\bitcomposer-cli.exe --version
      - name: Check the executables' details
        shell: pwsh
        run: |
          foreach ($exe in "dist\bitComposer\bitComposer.exe", "dist\bitComposer\bitcomposer-cli.exe") {
            $v = (Get-Item $exe).VersionInfo
            Write-Host "$exe : $($v.ProductName) $($v.ProductVersion) / $($v.CompanyName) / $($v.LegalCopyright)"
            if ($v.LegalCopyright -notmatch "Enlightened Solutions LLC" -or $v.CompanyName -ne "CatDogBark") { throw "version details missing on $exe" }
          }
      - name: Smoke test the player build
        shell: pwsh
        run: |
          # The player is a windowed program: Start-Process -Wait for its exit
          # code. The screenshots are the frozen build drawing its window on
          # Windows, offscreen, as it opens on each screen (WxH physical, then
          # the scaling), with both panels open where the name says "all".
          $exe = "dist\bitComposer\bitComposer.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "bitComposer.exe --check exited $($p.ExitCode)" }
          New-Item -ItemType Directory -Force -Path shots | Out-Null
          $shots = @(
            @("1920x1080-150", "1920x1080", "1.5", ""),
            @("1920x1080-150-all", "1920x1080", "1.5", "settings,mix"),
            @("1920x1080-100-all", "1920x1080", "1", "settings,mix"),
            @("1366x768-100-all", "1366x768", "1", "settings,mix"),
            @("2560x1440-125-all", "2560x1440", "1.25", "settings,mix"),
            @("3840x2160-200-all", "3840x2160", "2", "settings,mix")
          )
          foreach ($s in $shots) {
            $a = @("--screenshot", "shots\$($s[0]).png", "--screen", $s[1], "--scale", $s[2])
            if ($s[3]) { $a += @("--panels", $s[3]) }
            $p = Start-Process -FilePath $exe -ArgumentList $a -Wait -PassThru
            if ($p.ExitCode -ne 0 -or -not (Test-Path "shots\$($s[0]).png")) { throw "screenshot $($s[0]) failed ($($p.ExitCode))" }
          }
          Get-ChildItem shots
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          @"
          bitComposer for Windows
          =======================

          bitComposer-setup.exe installs this for you (Start menu, updates from the player's UPDATE button).
          This zip is the same program without installing: keep the bitComposer folder together and run
          bitComposer.exe from it.

          bitComposer.exe       the player: plays your folder, generates the next song as the current one ends,
                                live mixer, keep or prune, settings for what it composes. Needs nothing else.
                                Closing the window leaves it playing in the tray; quit from the tray menu.
                                Ctrl + and Ctrl - zoom the window, Ctrl 0 resets.
          bitcomposer-cli.exe   the command line, e.g.  bitcomposer-cli -n 10 --sound megamanx -d "%USERPROFILE%\Music\bitComposer"

          Songs are Impulse Tracker (.it) files and play in any tracker player as well (XMPlay, OpenMPT).

          Style packs: ffvi, mana, evermore, megamanx. Leave the pack on "random" and half the SNES songs draw one.
          Windows SmartScreen may warn because the executables are not code-signed; "More info" then "Run anyway".
          "@ | Set-Content -Path pkg/README-WINDOWS.txt
          Copy-Item pkg/README-WINDOWS.txt dist/bitComposer/
          Compress-Archive -Path dist/bitComposer -DestinationPath bitComposer-windows.zip -Force
      - name: Installer
        shell: pwsh
        run: |
          # Inno Setup makes bitComposer-setup.exe: Start menu entry, desktop
          # shortcut (optional), uninstaller. Unsigned, like the executables.
          choco install innosetup --no-progress -y | Out-Null
          $version = python -c "import bitcomposer; print(bitcomposer.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" tools\windows\installer.iss
          Get-ChildItem bitComposer-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: bitComposer-windows
          path: |
            bitComposer-windows.zip
            bitComposer-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: player-screenshots-windows
          path: shots/
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ inputs.tag }}" -ne "") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          # A tag pushed without a release yet: make the release from the tag
          # message, then attach. (0.9.0 and 0.9.1 failed here for want of it.)
          # An rc, alpha or beta tag is a pre-release, so the "Latest" badge
          # and the README's release badge keep pointing at the last real one.
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            # A dispatched build checks out main, not the tag, so fetch the
            # tag first: --notes-from-tag reads the tag message locally.
            git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
            $notes = if ($LASTEXITCODE -eq 0) { "--notes-from-tag" } else { "--generate-notes" }
            if ($tag -match '(a|b|rc)\d+$') { gh release create $tag --title $tag $notes --prerelease }
            else { gh release create $tag --title $tag $notes }
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload $tag bitComposer-windows.zip bitComposer-setup.exe --clobber
