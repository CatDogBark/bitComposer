name: CI

# Pull requests into main (a release): every supported Python. The run on a
# push to main repeats the pull request's (main takes nothing else, so the
# merge commit is the tree the pull request tested); it is kept only so the
# README's badge shows main's latest run, and nothing waits on it. Pull
# requests into dev run nothing here; the tests are run locally before them
# (CONTRIBUTING.md), and a run can be started by hand on any branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: libopenmpt for the player's tests
        run: sudo apt-get install -y -q libopenmpt0 > /dev/null || sudo apt-get install -y -q libopenmpt0t64 > /dev/null
      - name: Qt for the window's tests (offscreen), D-Bus for the MPRIS test
        run: |
          sudo apt-get install -y -q libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 dbus-daemon > /dev/null || sudo apt-get install -y -q libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 dbus > /dev/null
          # Qt as the package asks for it (pyproject.toml's dependencies), so
          # the tests run on what a user's pip installs on this Python.
          python -m pip install --quiet .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate and measure a batch
        run: |
          for s in 1 2 3 4 5 6; do python -m bitcomposer.cli -s $s -d out; done
          python tools/analyze.py 'out/*.it'
      - name: Package installs cleanly
        run: |
          python -m pip install --quiet .
          cd / && bitcomposer --version
          python -c "import bitcomposer, importlib.util; assert importlib.util.find_spec('tests') is None"
