name: Publish to PyPI

# On a version tag: build the sdist and wheel, check that the tag names the
# package's own version, and upload through PyPI's trusted publishing (the
# "pending publisher" registered on pypi.org for this repository, this
# workflow file and the "pypi" environment: no API token lives anywhere).
# Pre-release tags (v1.0.0rc1) publish as pre-releases, which pip and pipx
# skip unless asked for by exact version, so the pipeline can be proven on
# an rc before the real tag.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          version=$(python -c "import bitcomposer; print(bitcomposer.__version__)")
          test "v$version" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} but bitcomposer.__version__ is $version"; exit 1; }
      - name: Build
        run: |
          python -m pip install --quiet --upgrade build
          python -m build
      - name: The wheel installs and runs
        run: |
          python -m pip install --quiet dist/*.whl
          cd / && bitcomposer --version && bitcomposer -s 1 -d /tmp/out && ls /tmp/out
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
