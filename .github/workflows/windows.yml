name: Windows build

# Builds the player (bitComposer.exe, a folder build: Qt starts in a moment
# from a folder, where a single file would unpack ~100 MB on every launch,
# with the SNES emulator built from the same commit so IMPORT works with
# nothing more to install) and the command line (bitcomposer-cli.exe, one
# file, no Qt) on a Windows runner, checks IMPORT's worker mode, renders the
# player offscreen at common screen sizes and scalings, then
# zips the folder with a short readme, builds the installer, keeps all of it
# as workflow artifacts, and on a tag (or a manual run naming one) attaches
# the zip and the installer to that GitHub release. The build runs on every
# push to main and on pull requests as well, so a broken Windows build shows
# up when it breaks and not on release day (0.9.0 and 0.9.1 both found out
# at the tag).
# main, tags, and pull requests into main (a release); not pull requests
# into dev (see ci.yml). Start it by hand on a branch whose change could
# break the Windows build.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the zip to (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write        # signing: the job signs in to Azure with GitHub's OIDC token, no stored password

jobs:
  build:
    runs-on: windows-latest
    # The "signing" environment holds the Azure IDs and the signing account's
    # names; Azure trusts this repository's runs in that environment (a
    # federated credential), and nothing else.
    environment: signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip pyinstaller
          python -m pip install --quiet .
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the emulator
        run: |
          # The SNES emulator (emu/, the bitcomposer-emu wheel) from this very
          # commit, installed so PyInstaller packs it in beside libopenmpt:
          # the Windows build carries it, and its users never install it.
          python -m pip install --quiet maturin
          cd emu
          maturin build --release --out ..\build\emu
          cd ..
          python -m pip install --quiet --no-index --find-links build\emu bitcomposer-emu
          python -c "from bitcomposer.spc import emulate; assert emulate.available(), 'the emulator built is not the one the package calls'"
      - name: Smoke test
        run: |
          python -m bitcomposer.cli --version
          python -m bitcomposer.cli -s 11 --style snes --pack megamanx -d out
          dir out
      - name: Fetch libopenmpt for Windows
        shell: pwsh
        run: |
          # The player plays through libopenmpt. The official Windows dev
          # build (lib.openmpt.org) carries libopenmpt.dll with its
          # openmpt-*.dll companions for x64; the newest 0.x release zip is
          # taken from the listing so the version is not pinned here.
          $index = Invoke-WebRequest -UseBasicParsing https://lib.openmpt.org/files/libopenmpt/dev/
          $names = [regex]::Matches($index.Content, 'libopenmpt-[0-9.]+\+release\.dev\.windows\.vs\d+\.zip') | ForEach-Object { $_.Value } | Sort-Object -Unique
          if (-not $names) { throw "no libopenmpt Windows dev zip found in the listing" }
          $zip = $names | Sort-Object { [version]([regex]::Match($_, '\d+\.\d+\.\d+').Value) } | Select-Object -Last 1
          Write-Host "libopenmpt: $zip"
          Invoke-WebRequest -UseBasicParsing "https://lib.openmpt.org/files/libopenmpt/dev/$zip" -OutFile libopenmpt.zip
          Expand-Archive libopenmpt.zip -DestinationPath libopenmpt
          $dir = Get-ChildItem -Recurse -Directory libopenmpt | Where-Object { Test-Path (Join-Path $_.FullName 'libopenmpt.dll') } | Where-Object { $_.FullName -match 'amd64|x64|x86_64' } | Select-Object -First 1
          if (-not $dir) { throw "libopenmpt.dll for x64 not found in $zip" }
          New-Item -ItemType Directory -Force -Path dll | Out-Null
          Copy-Item (Join-Path $dir.FullName '*.dll') dll/
          Get-ChildItem dll
      - name: Build executables
        run: |
          # Windows paths are case-insensitive: "bitcomposer" and "bitComposer"
          # would be one file, so the command line gets a -cli suffix and
          # goes into the player's folder. bitComposer.exe is the player (it
          # generates as well); the libopenmpt DLLs sit in its bundle, where
          # player/openmpt.py looks, and --collect-data brings the window's
          # QML, font and icon. The command line leaves Qt out.
          # The version resources name the product, publisher and copyright
          # holder in Explorer's Properties > Details.
          python tools/windows/make_icon.py build/bitcomposer.ico
          python tools/windows/make_version_file.py build/version-cli.txt bitcomposer-cli.exe "bitComposer command line"
          python tools/windows/make_version_file.py build/version-player.txt bitComposer.exe "bitComposer"
          pyinstaller --noconfirm --onefile --name bitcomposer-cli --console --icon build/bitcomposer.ico --version-file build/version-cli.txt --collect-submodules bitcomposer --exclude-module PySide6 --exclude-module shiboken6 tools/windows/launch_cli.py
          pyinstaller --noconfirm --onedir --name bitComposer --windowed --icon build/bitcomposer.ico --version-file build/version-player.txt --collect-submodules bitcomposer --collect-data bitcomposer --hidden-import bitcomposer_emu --add-binary "dll/*.dll;." tools/windows/launch_player.py
          Copy-Item dist/bitcomposer-cli.exe dist/bitComposer/
          dist\bitComposer\bitcomposer-cli.exe --version
      # Code signing (Azure Artifact Signing, the certificate in the name of
      # Enlightened Solutions LLC): release builds only, that is tags and
      # runs started by hand; pushes and pull requests build unsigned. With
      # the environment not set up yet, every build is unsigned and says so.
      - name: Signing for this build?
        id: sign
        shell: pwsh
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          RELEASE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if (-not $env:CLIENT_ID) { Write-Host "::notice::Code signing is not set up (the signing environment has no AZURE_CLIENT_ID): this build is unsigned"; "on=false" >> $env:GITHUB_OUTPUT }
          elseif ($env:RELEASE -ne "true") { Write-Host "Not a release build: unsigned"; "on=false" >> $env:GITHUB_OUTPUT }
          else { "on=true" >> $env:GITHUB_OUTPUT }
      - uses: azure/login@v2
        if: steps.sign.outputs.on == 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the executables
        if: steps.sign.outputs.on == 'true'
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
        run: |
          # signtool with Artifact Signing's dlib, which signs in through the
          # Azure login above. The same command signs the installer and its
          # uninstaller in the Installer step.
          nuget install Microsoft.ArtifactSigning.Client -x -OutputDirectory signing | Out-Null
          $dlib = Get-ChildItem -Recurse signing -Filter "*Dlib.dll" | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $dlib) { throw "Artifact Signing dlib not found in the NuGet package" }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          @{ Endpoint = $env:SIGNING_ENDPOINT; CodeSigningAccountName = $env:SIGNING_ACCOUNT; CertificateProfileName = $env:SIGNING_PROFILE } | ConvertTo-Json | Set-Content signing\metadata.json
          $meta = (Resolve-Path signing\metadata.json).Path
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "SIGN_DLIB=$($dlib.FullName)" >> $env:GITHUB_ENV
          "SIGN_META=$meta" >> $env:GITHUB_ENV
          & $signtool.FullName sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib $dlib.FullName /dmdf $meta dist\bitComposer\bitComposer.exe dist\bitComposer\bitcomposer-cli.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool exited $LASTEXITCODE" }
      - name: Check the executables' details
        shell: pwsh
        run: |
          foreach ($exe in "dist\bitComposer\bitComposer.exe", "dist\bitComposer\bitcomposer-cli.exe") {
            $v = (Get-Item $exe).VersionInfo
            Write-Host "$exe : $($v.ProductName) $($v.ProductVersion) / $($v.CompanyName) / $($v.LegalCopyright)"
            if ($v.LegalCopyright -notmatch "Enlightened Solutions LLC" -or $v.CompanyName -ne "Enlightened Solutions LLC") { throw "version details missing on $exe" }
          }
      - name: Smoke test the player build
        shell: pwsh
        run: |
          # The player is a windowed program: Start-Process -Wait for its exit
          # code. The screenshots are the frozen build drawing its window on
          # Windows, offscreen, as it opens on each screen (WxH physical, then
          # the scaling), with both panels open where the name says "all".
          $exe = "dist\bitComposer\bitComposer.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "bitComposer.exe --check exited $($p.ExitCode)" }
          # IMPORT's worker: the exe started with its private marker runs the
          # SPC import (packs/library.py, launch_player.py) on one synthetic
          # song, the tests' tiny driver, instead of opening the window; and
          # its pool's helpers, which Windows starts by running the exe again,
          # do their task and go, where without freeze_support() each one
          # opened a player that stayed.
          python -c "import os, sys; sys.path.insert(0, 'tests'); from test_spc_convert import tiny; os.makedirs('worker/game', exist_ok=True); open('worker/game/01 Tiny.spc', 'wb').write(tiny().raw)"
          $p = Start-Process -FilePath $exe -ArgumentList @("--bitcomposer-worker", "--pack", "worker\out", "--name", "tiny_check", "--progress", "worker\progress.txt", "worker\game") -Wait -PassThru
          if (Test-Path worker\progress.txt) { Get-Content worker\progress.txt }
          if ($p.ExitCode -ne 0 -or -not (Test-Path worker\out\pack.json)) { throw "the worker mode made no pack (exit $($p.ExitCode))" }
          Start-Sleep 3
          $left = Get-Process bitComposer -ErrorAction SilentlyContinue
          if ($left) { $left | Stop-Process -Force; throw "bitComposer.exe was left running after the worker: its pool's helpers opened players" }
          Write-Host "worker mode: a pack made, no player opened"
          New-Item -ItemType Directory -Force -Path shots | Out-Null
          $shots = @(
            @("1920x1080-150", "1920x1080", "1.5", ""),
            @("1920x1080-150-all", "1920x1080", "1.5", "settings,mix"),
            @("1920x1080-100-all", "1920x1080", "1", "settings,mix"),
            @("1366x768-100-all", "1366x768", "1", "settings,mix"),
            @("2560x1440-125-all", "2560x1440", "1.25", "settings,mix"),
            @("3840x2160-200-all", "3840x2160", "2", "settings,mix")
          )
          foreach ($s in $shots) {
            $a = @("--screenshot", "shots\$($s[0]).png", "--screen", $s[1], "--scale", $s[2])
            if ($s[3]) { $a += @("--panels", $s[3]) }
            $p = Start-Process -FilePath $exe -ArgumentList $a -Wait -PassThru
            if ($p.ExitCode -ne 0 -or -not (Test-Path "shots\$($s[0]).png")) { throw "screenshot $($s[0]) failed ($($p.ExitCode))" }
          }
          Get-ChildItem shots
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          @"
          bitComposer for Windows
          =======================

          bitComposer-setup.exe installs this for you (Start menu, updates from the player's UPDATE button).
          This zip is the same program without installing: keep the bitComposer folder together and run
          bitComposer.exe from it.

          bitComposer.exe       the player: plays your folder, generates the next song as the current one ends,
                                live mixer, keep or prune, settings for what it composes. Needs nothing else.
                                Closing the window leaves it playing in the tray; quit from the tray menu.
                                Ctrl + and Ctrl - zoom the window, Ctrl 0 resets.
          bitcomposer-cli.exe   the command line, e.g.  bitcomposer-cli -n 10 --sound megamanx -d "%USERPROFILE%\Music\bitComposer"

          Songs are Impulse Tracker (.it) files and play in any tracker player as well (XMPlay, OpenMPT).

          Style packs: ffvi, mana, evermore, megamanx. Leave the pack on "random" and half the SNES songs draw one.
          Windows SmartScreen may warn because the executables are not code-signed; "More info" then "Run anyway".
          "@ | Set-Content -Path pkg/README-WINDOWS.txt
          Copy-Item pkg/README-WINDOWS.txt dist/bitComposer/
          Compress-Archive -Path dist/bitComposer -DestinationPath bitComposer-windows.zip -Force
      - name: Installer
        shell: pwsh
        run: |
          # Inno Setup makes bitComposer-setup.exe: Start menu entry, desktop
          # shortcut (optional), uninstaller. Unsigned, like the executables.
          choco install innosetup --no-progress -y | Out-Null
          $version = python -c "import bitcomposer; print(bitcomposer.__version__)"
          $numver = python -c "import re, bitcomposer; print('.'.join(re.match(r'(\d+)\.(\d+)\.(\d+)', bitcomposer.__version__).groups()) + '.0')"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if ("${{ steps.sign.outputs.on }}" -eq "true") {
            # Inno calls this for the setup and for the uninstaller it embeds ($q a quote, $f the file).
            $cmd = "`$q$env:SIGNTOOL`$q sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib `$q$env:SIGN_DLIB`$q /dmdf `$q$env:SIGN_META`$q `$f"
            & $iscc "/DAppVersion=$version" "/DAppNumVersion=$numver" "/DSigned=1" "/Ssign=$cmd" tools\windows\installer.iss
          } else {
            & $iscc "/DAppVersion=$version" "/DAppNumVersion=$numver" tools\windows\installer.iss
          }
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }
          Get-ChildItem bitComposer-setup.exe
      - name: Install, check Installed apps, uninstall
        shell: pwsh
        run: |
          # What a user does: run the installer (quietly here), find the app
          # in Settings > Apps > Installed apps (the Uninstall registry key),
          # start it, then uninstall from there and check nothing is left.
          $p = Start-Process -FilePath .\bitComposer-setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "setup exited $($p.ExitCode)" }
          $roots = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall", "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall"
          $key = Get-ChildItem $roots -ErrorAction SilentlyContinue | Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like "bitComposer*" } | Select-Object -First 1
          if (-not $key) { throw "no Installed apps entry" }
          $e = Get-ItemProperty $key.PSPath
          Write-Host "Installed apps: $($e.DisplayName) | $($e.Publisher) | $($e.DisplayVersion) | $($e.InstallLocation) | $($e.UninstallString)"
          if ($e.Publisher -ne "Enlightened Solutions LLC") { throw "publisher is '$($e.Publisher)'" }
          $exe = Join-Path $e.InstallLocation "bitComposer.exe"
          if (-not (Test-Path $exe)) { throw "bitComposer.exe was not installed" }
          $menu = Join-Path ([Environment]::GetFolderPath("Programs")) "bitComposer\bitComposer.lnk"
          if (-not (Test-Path $menu)) { throw "no Start menu entry at $menu" }
          $p = Start-Process -FilePath $exe -ArgumentList "--check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the installed bitComposer.exe --check exited $($p.ExitCode)" }
          $un = $e.UninstallString.Trim('"')
          Start-Process -FilePath $un -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          # The uninstaller hands itself off to a copy in TEMP and returns early.
          for ($i = 0; $i -lt 90 -and ((Test-Path $exe) -or (Test-Path $key.PSPath)); $i++) { Start-Sleep 1 }
          if (Test-Path $exe) { throw "uninstall left $exe" }
          if (Test-Path $key.PSPath) { throw "uninstall left the Installed apps entry" }
          if (Test-Path $menu) { throw "uninstall left the Start menu entry" }
          Write-Host "installed, listed, started, uninstalled: clean"
      - name: Check the signatures
        if: steps.sign.outputs.on == 'true'
        shell: pwsh
        run: |
          foreach ($f in "dist\bitComposer\bitComposer.exe", "dist\bitComposer\bitcomposer-cli.exe", "bitComposer-setup.exe") {
            $s = Get-AuthenticodeSignature $f
            Write-Host "$f : $($s.Status) / $($s.SignerCertificate.Subject)"
            if ($s.Status -ne "Valid" -or $s.SignerCertificate.Subject -notmatch "Enlightened Solutions LLC") { throw "$f is not signed by Enlightened Solutions LLC" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: bitComposer-windows
          path: |
            bitComposer-windows.zip
            bitComposer-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: player-screenshots-windows
          path: shots/
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ inputs.tag }}" -ne "") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          # A tag pushed without a release yet: make the release from the tag
          # message, then attach. (0.9.0 and 0.9.1 failed here for want of it.)
          # An rc, alpha or beta tag is a pre-release, so the "Latest" badge
          # and the README's release badge keep pointing at the last real one.
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            # A dispatched build checks out main, not the tag, so fetch the
            # tag first: --notes-from-tag reads the tag message locally.
            git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
            $notes = if ($LASTEXITCODE -eq 0) { "--notes-from-tag" } else { "--generate-notes" }
            if ($tag -match '(a|b|rc)\d+$') { gh release create $tag --title $tag $notes --prerelease }
            else { gh release create $tag --title $tag $notes }
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload $tag bitComposer-windows.zip bitComposer-setup.exe --clobber
          # The release page names the code signing policy, as the signing
          # programme asks of every download page.
          $body = gh release view $tag --json body --jq .body
          if ($body -notmatch "Code signing policy") {
            Set-Content notes.md $body
            Add-Content notes.md "`n`n[Code signing policy](https://github.com/CatDogBark/bitComposer#code-signing-policy) · [Privacy](https://github.com/CatDogBark/bitComposer#privacy)"
            gh release edit $tag --notes-file notes.md
          }
