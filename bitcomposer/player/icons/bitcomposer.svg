<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- The bit tile: a 5x5 pixel grid, each bit app lighting its own glyph,
       the pink bit always the top-right cell. bitComposer: level bars. -->
  <rect x="4" y="4" width="248" height="248" rx="56" fill="#0e1612" stroke="#1a2e26" stroke-width="6"/>
  <g fill="#13221b">
    <rect x="42" y="42" width="30" height="30" rx="3"/>
    <rect x="78" y="42" width="30" height="30" rx="3"/>
    <rect x="114" y="42" width="30" height="30" rx="3"/>
    <rect x="150" y="42" width="30" height="30" rx="3"/>
    <rect x="42" y="78" width="30" height="30" rx="3"/>
    <rect x="78" y="78" width="30" height="30" rx="3"/>
    <rect x="150" y="78" width="30" height="30" rx="3"/>
    <rect x="42" y="114" width="30" height="30" rx="3"/>
    <rect x="150" y="114" width="30" height="30" rx="3"/>
  </g>
  <g fill="#00ff88">
    <rect x="114" y="78" width="30" height="30" rx="3"/>
    <rect x="186" y="78" width="30" height="30" rx="3"/>
    <rect x="78" y="114" width="30" height="30" rx="3"/>
    <rect x="114" y="114" width="30" height="30" rx="3"/>
    <rect x="186" y="114" width="30" height="30" rx="3"/>
    <rect x="42" y="150" width="30" height="30" rx="3"/>
    <rect x="78" y="150" width="30" height="30" rx="3"/>
    <rect x="114" y="150" width="30" height="30" rx="3"/>
    <rect x="150" y="150" width="30" height="30" rx="3"/>
    <rect x="186" y="150" width="30" height="30" rx="3"/>
    <rect x="42" y="186" width="30" height="30" rx="3"/>
    <rect x="78" y="186" width="30" height="30" rx="3"/>
    <rect x="114" y="186" width="30" height="30" rx="3"/>
    <rect x="150" y="186" width="30" height="30" rx="3"/>
    <rect x="186" y="186" width="30" height="30" rx="3"/>
  </g>
  <rect x="186" y="42" width="30" height="30" rx="3" fill="#ff0055"/>
</svg>
