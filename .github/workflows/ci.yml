name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate and measure a batch
        run: |
          for s in 1 2 3 4 5 6; do python -m bitcomposer.cli -s $s -d out; done
          python tools/analyze.py 'out/*.it'
      - name: Package installs cleanly
        run: |
          python -m pip install --quiet .
          cd / && bitcomposer --version
          python -c "import bitcomposer, pkgutil; assert not pkgutil.find_loader('tests')"
